// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (

function detectCategory(text) {
  const t = text;
  const hasContam = /이물질|기름|음식물.*묻|오염|더럽|묻어있|잔여물|세척 필요|씻어야/.test(t);
  const hasMulti  = /라벨|스티커|이중포장|다중포장|포장재.*붙/.test(t);

  if (/건전지|배터리|전지/.test(t)) return 22;
  if (/스티로폼|스티로 폼|완충재/.test(t)) return hasContam ? 21 : 20;
  if (/소주병|맥주병|공병/.test(t)) return hasMulti ? 17 : 4;
  if (/유리/.test(t)) {
    if (hasContam) return 12;
    return hasMulti ? 18 : 5;
  }
  if (/페트|pet|생수병/.test(t)) {
    if (hasContam && hasMulti) return 13;
    if (hasContam) return 14;
    return hasMulti ? 19 : 6;
  }
  if (/플라스틱|샴푸|세제통/.test(t)) return hasContam ? 15 : 7;
  if (/비닐|봉지|봉투|뽁뽁이/.test(t)) return hasContam ? 16 : 8;
  if (/캔|알루미늄|음료캔|참치캔|맥주캔/.test(t)) return hasContam ? 11 : 3;
  if (/종이팩|우유팩|두유팩|주스팩/.test(t)) return 1;
  if (/종이컵|일회용컵/.test(t)) return hasContam ? 10 : 2;
  if (/종이|신문|박스|상자|골판지|책|전단/.test(t)) return hasContam ? 9 : 0;
  if (/병/.test(t)) return 5;
  if (/용기|포장/.test(t)) return hasContam ? 15 : 7;
  return 7;
}

/* ── Typewriter hook ──────────────────────────────────────────────────── */
function useTypewriter(text, speed, active) {
  const [disp, setDisp] = useState('');
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (!active || !text) { setDisp(''); setDone(false); return; }
    let i = 0; setDisp(''); setDone(false);
    const id = setInterval(() => {
      i++; setDisp(text.slice(0, i));
      if (i >= text.length) { clearInterval(id); setDone(true); }
    }, speed);
    return () => clearInterval(id);
  }, [text, active, speed]);
  return { disp, done };
}

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [imgSrc, setImgSrc] = useState(null);
  const [imgFile, setImgFile] = useState(null);
  const [desc, setDesc] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [apiUrl, setApiUrl] = useState('http://localhost:5000/predict');
  const [apiMode, setApiMode] = useState('mock'); // 'mock' | 'api' | 'error'
  const [apiError, setApiError] = useState(null); // 에러 메시지

  const fileRef = useRef(null);
  const camRef  = useRef(null);

  const loadFile = file => {
    if (!file || !file.type.startsWith('image/')) return;
    setImgFile(file); setResult(null);
    const r = new FileReader();
    r.onload = e => setImgSrc(e.target.result);
    r.readAsDataURL(file);
  };

  const onDrop = useCallback(e => {
    e.preventDefault(); setDragOver(false);
    loadFile(e.dataTransfer.files[0]);
  }, []);

  const testConnection = async () => {
    if (!apiUrl.trim()) return;
    setApiError('테스트 중...');
    try {
      const res = await fetch(apiUrl.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: '테스트' }),
        signal: AbortSignal.timeout(4000)
      });
      if (res.ok) {
        setApiMode('api'); setApiError('✓ 연결 성공! 서버가 응답했습니다.');
      } else {
        setApiMode('error'); setApiError(`✗ 서버 응답 오류: HTTP ${res.status} ${res.statusText}`);
      }
    } catch (e) {
      setApiMode('error');
      if (e.name === 'TimeoutError') setApiError('✗ 타임아웃: 서버가 4초 내 응답하지 않았습니다.');
      else if (e.message.includes('Failed to fetch') || e.message.includes('ERR_CONNECTION_REFUSED'))
        setApiError('✗ 연결 거부: 서버가 실행 중이지 않거나 URL이 잘못됐습니다.');
      else if (e.message.includes('CORS'))
        setApiError('✗ CORS 오류: 서버에 CORS 허용 설정이 필요합니다.\n   Flask: flask_cors 설치 후 CORS(app) 추가');
      else setApiError(`✗ 오류: ${e.message}`);
    }
  };

  const analyze = async () => {
    if (!imgFile && !desc.trim()) return;
    setLoading(true); setResult(null); setApiError(null);

    /* ── 실제 API 호출 시도 ────────────────────────────────────── */
    if (apiUrl.trim()) {
      try {
        const res = await fetch(apiUrl.trim(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: desc.trim(), image: imgSrc || null }),
          signal: AbortSignal.timeout(8000)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const data = await res.json();
        const id  = data.predicted_class ?? data.category_id ?? 7;
        const conf = data.confidence != null ? Math.round(data.confidence * 100) : null;
        const entry = { ...DISPOSAL_GUIDE[id] };
        if (conf !== null) entry.confidence = conf;
        setApiMode('api'); setApiError('✓ API 응답 수신 완료');
        setResult(entry);
        setLoading(false);
        return;
      } catch (e) {
        let msg = '';
        if (e.name === 'TimeoutError') msg = '✗ 타임아웃: 서버가 8초 내 응답하지 않았습니다.';
        else if (e.message.includes('Failed to fetch') || e.message.includes('ERR_CONNECTION_REFUSED'))
          msg = '✗ 연결 거부: Flask 서버가 실행 중인지 확인하세요.\n   → python app.py 또는 uvicorn main:app';
        else if (e.message.includes('CORS'))
          msg = '✗ CORS 오류: 서버에 CORS 설정 추가 필요\n   → from flask_cors import CORS; CORS(app)';
        else msg = `✗ ${e.message}`;
        setApiMode('error'); setApiError(msg);
      }
    }

    /* ── Mock 폴백 ────────────────────────────────────────────── */
    await sleep(1800 + Math.random() * 500);
    setApiMode(apiUrl.trim() ? 'error' : 'mock');
    setResult(DISPOSAL_GUIDE[detectCategory(desc)]);
    setLoading(false);
  };

  const reset = () => { setResult(null); setDesc(''); setImgFile(null); setImgSrc(null); };
  const canRun = (imgFile || desc.trim()) && !loading;
  const dark = th.id === 'dark';

  return (
    <div style={{ minHeight: '100vh', background: th.bg, color: th.text, display: 'flex', flexDirection: 'column' }}>

      {/* ── Header ──────────────────────────────────────────────────── */}
      <header style={{
        height: 54, padding: '0 28px', flexShrink: 0,
        borderBottom: `1px solid ${th.border}`,
        background: th.surface, boxShadow: th.shadow,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between'
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{
            width: 28, height: 28, borderRadius: th.r,
            border: `1px solid ${th.border}`, background: th.surfaceAlt,
            display: 'flex', alignItems: 'center', justifyContent: 'center'
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={th.textSub} strokeWidth="1.8">
              <polyline points="1 4 1 10 7 10"/>
              <polyline points="23 20 23 14 17 14"/>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
          </div>
          <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: '-0.02em', color: th.text }}>
            분리수거 도움 웹
          </span>
          {dark && (
            <span style={{
              fontSize: 9, fontFamily: th.mono, color: th.textMuted,
              letterSpacing: '0.12em', border: `1px solid ${th.border}`,
              padding: '1px 5px', borderRadius: '2px'
            }}>BETA</span>
          )}
        </div>
        <span style={{ fontSize: 11, color: th.textMuted, fontFamily: th.mono, letterSpacing: dark ? '0.07em' : 0 }}>
          {dark ? 'AI-POWERED RECYCLING GUIDE' : '올바른 분리수거를 도와드립니다'}
        </span>
      </header>

      {/* ── Main grid ───────────────────────────────────────────────── */}
      <div style={{
        flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr',
        maxWidth: 1040, width: '100%', margin: '0 auto',
        padding: '26px 22px', gap: 18, alignContent: 'start'
      }}>

        {/* LEFT ─ Input column */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>

          {/* Drag & drop zone */}
          <div
            onDrop={onDrop}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onClick={() => !imgSrc && fileRef.current?.click()}
            style={{
              position: 'relative', borderRadius: th.rLg, overflow: 'hidden',
              border: `1.5px ${imgSrc ? 'solid' : 'dashed'} ${dragOver ? th.borderActive : imgSrc ? th.borderActive : th.border}`,
              background: dragOver ? (dark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.02)') : th.surface,
              cursor: imgSrc ? 'default' : 'pointer',
              transition: 'all 0.2s ease', minHeight: 200,
              display: 'flex', flexDirection: 'column',
              boxShadow: th.shadow
            }}
          >
            {imgSrc ? (
              <>
                <img src={imgSrc} alt="첨부된 이미지" style={{ width: '100%', height: 220, objectFit: 'cover', display: 'block' }} />
                {loading && <ScanOverlay th={th} />}
                <div style={{ position: 'absolute', top: 8, right: 8, display: 'flex', gap: 6 }}>
                  <button onClick={e => { e.stopPropagation(); fileRef.current?.click(); }} style={{
                    background: 'rgba(0,0,0,0.72)', backdropFilter: 'blur(8px)',
                    color: '#d0d0d0', border: '1px solid rgba(255,255,255,0.1)',
                    borderRadius: '5px', padding: '4px 10px', fontSize: 11,
                    cursor: 'pointer', fontFamily: 'Noto Sans KR, sans-serif'
                  }}>변경</button>
                  <button onClick={e => { e.stopPropagation(); reset(); }} style={{
                    background: 'rgba(0,0,0,0.72)', backdropFilter: 'blur(8px)',
                    color: '#f87171', border: '1px solid rgba(248,113,113,0.2)',
                    borderRadius: '5px', padding: '4px 10px', fontSize: 11,
                    cursor: 'pointer', fontFamily: 'Noto Sans KR, sans-serif'
                  }}>삭제</button>
                </div>
              </>
            ) : (
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 32, gap: 12 }}>
                <div style={{
                  width: 44, height: 44, borderRadius: th.rLg,
                  border: `1px solid ${th.border}`, background: th.surfaceAlt,
                  display: 'flex', alignItems: 'center', justifyContent: 'center'
                }}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={th.textSub} strokeWidth="1.4">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                  </svg>
                </div>
                <div style={{ textAlign: 'center' }}>
                  <p style={{ fontSize: 13, fontWeight: 600, color: th.text, marginBottom: 4 }}>이미지 드래그 또는 클릭</p>
                  <p style={{ fontSize: 11, color: th.textSub }}>JPG, PNG, WEBP 형식 지원</p>
                </div>
              </div>
            )}
          </div>

          {/* Camera button */}
          <button onClick={() => camRef.current?.click()} style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
            padding: '9px', background: th.surface, border: `1px solid ${th.border}`,
            borderRadius: th.r, color: th.textSub, fontSize: 12, cursor: 'pointer',
            transition: 'border-color 0.2s', boxShadow: th.shadow,
            fontFamily: 'Noto Sans KR, sans-serif'
          }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            카메라로 직접 촬영
          </button>

          {/* Hidden inputs */}
          <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => loadFile(e.target.files[0])} />
          <input ref={camRef}  type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={e => loadFile(e.target.files[0])} />

          {/* Divider */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '2px 0' }}>
            <div style={{ flex: 1, height: 1, background: th.border }} />
            <span style={{ fontSize: 10, color: th.textMuted, fontFamily: th.mono }}>또는</span>
            <div style={{ flex: 1, height: 1, background: th.border }} />
          </div>

          {/* Text input */}
          <div>
            <label style={{
              display: 'block', fontSize: 10, color: th.textSub, marginBottom: 7,
              fontFamily: th.mono, letterSpacing: dark ? '0.08em' : 0
            }}>
              {dark ? 'WASTE CONDITION' : '쓰레기 상태 설명'}
            </label>
            <textarea
              value={desc}
              onChange={e => setDesc(e.target.value)}
              placeholder={'예: 음료수 페트병, 라벨이 붙어있고\n내용물이 조금 남아있음'}
              rows={4}
              style={{
                width: '100%', padding: '11px 13px',
                background: th.inputBg, border: `1px solid ${th.border}`,
                borderRadius: th.r, color: th.text, fontSize: 13,
                lineHeight: 1.7, resize: 'none', outline: 'none',
                fontFamily: 'Noto Sans KR, sans-serif',
                transition: 'border-color 0.2s', boxShadow: th.shadow
              }}
              onFocus={e => e.target.style.borderColor = th.borderFocus}
              onBlur={e => e.target.style.borderColor = th.border}
            />
          </div>

          {/* API 엔드포인트 설정 */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <label style={{
                fontSize: 10, color: th.textSub, fontFamily: th.mono,
                letterSpacing: dark ? '0.08em' : 0
              }}>
                {dark ? 'API ENDPOINT' : 'API 엔드포인트'}
              </label>
              <span style={{
                fontSize: 10, padding: '1px 7px', borderRadius: th.rFull,
                fontFamily: th.mono,
                background: apiMode === 'api' ? (dark ? 'rgba(74,222,128,0.1)' : '#f0fdf4') : apiMode === 'error' ? (dark ? 'rgba(248,113,113,0.1)' : '#fef2f2') : th.badgeBg,
                color: apiMode === 'api' ? '#4ade80' : apiMode === 'error' ? '#f87171' : th.badgeText,
                border: `1px solid ${apiMode === 'api' ? 'rgba(74,222,128,0.2)' : apiMode === 'error' ? 'rgba(248,113,113,0.2)' : th.border}`
              }}>
                {apiMode === 'api' ? '● CONNECTED' : apiMode === 'error' ? '● FALLBACK' : '○ MOCK'}
              </span>
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              <input
                type="text"
                value={apiUrl}
                onChange={e => { setApiUrl(e.target.value); setApiMode('mock'); setApiError(null); }}
                placeholder="http://localhost:5000/predict"
                style={{
                  flex: 1, padding: '8px 11px',
                  background: th.inputBg, border: `1px solid ${th.border}`,
                  borderRadius: th.r, color: th.text, fontSize: 11,
                  outline: 'none', fontFamily: th.mono,
                  transition: 'border-color 0.2s'
                }}
                onFocus={e => e.target.style.borderColor = th.borderFocus}
                onBlur={e => e.target.style.borderColor = th.border}
              />
              <button onClick={testConnection} style={{
                flexShrink: 0, padding: '8px 11px',
                background: th.surfaceAlt, border: `1px solid ${th.border}`,
                borderRadius: th.r, color: th.textSub, fontSize: 11,
                cursor: 'pointer', fontFamily: th.mono, whiteSpace: 'nowrap',
                transition: 'border-color 0.2s'
              }}>
                PING
              </button>
            </div>
            {apiError && (
              <pre style={{
                fontSize: 10, color: apiMode === 'api' ? '#4ade80' : '#f87171',
                fontFamily: th.mono, lineHeight: 1.6, margin: 0,
                background: apiMode === 'api' ? 'rgba(74,222,128,0.05)' : 'rgba(248,113,113,0.05)',
                border: `1px solid ${apiMode === 'api' ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)'}`,
                borderRadius: th.r, padding: '7px 10px', whiteSpace: 'pre-wrap', wordBreak: 'break-all'
              }}>{apiError}</pre>
            )}
          </div>

          {/* Analyze button */}
          <button onClick={analyze} disabled={!canRun} style={{
            width: '100%', padding: '12px 0',
            background: canRun ? th.btnBg : th.border,
            color: canRun ? th.btnText : th.textMuted,
            border: 'none', borderRadius: th.r,
            fontSize: 12, fontWeight: 700, cursor: canRun ? 'pointer' : 'not-allowed',
            transition: 'all 0.2s',
            letterSpacing: dark ? '0.1em' : '0.02em',
            fontFamily: dark ? th.mono : 'Noto Sans KR, sans-serif',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8
          }}>
            {loading ? (
              <>
                <div style={{
                  width: 12, height: 12, borderRadius: '50%',
                  border: `1.5px solid ${th.btnText}30`,
                  borderTopColor: th.btnText,
                  animation: 'spin 0.7s linear infinite'
                }} />
                {th.label('ANALYZING')}
              </>
            ) : th.label('ANALYZE')}
          </button>
        </div>

        {/* RIGHT ─ Result column */}
        <div style={{
          background: th.surface, borderRadius: th.rLg,
          border: `1px solid ${th.border}`,
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden', boxShadow: th.shadow, minHeight: 480
        }}>
          {/* Result header bar */}
          <div style={{
            padding: '13px 20px', borderBottom: `1px solid ${th.border}`,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            flexShrink: 0
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{
                width: 6, height: 6, borderRadius: '50%',
                background: result ? th.text : (loading ? th.textSub : th.textMuted),
                transition: 'background 0.4s',
                animation: loading ? 'pulse 1s ease infinite' : 'none'
              }} />
              <span style={{ fontSize: 11, color: th.textSub, fontFamily: th.mono, letterSpacing: dark ? '0.08em' : 0 }}>
                {th.label('OUTPUT')}
                {result && (
                  <span style={{
                    marginLeft: 8, fontSize: 9, padding: '1px 6px', borderRadius: th.rFull,
                    background: apiMode === 'api' ? 'rgba(74,222,128,0.1)' : th.badgeBg,
                    color: apiMode === 'api' ? '#4ade80' : th.textMuted,
                    border: `1px solid ${apiMode === 'api' ? 'rgba(74,222,128,0.2)' : th.border}`,
                    fontFamily: th.mono
                  }}>
                    {apiMode === 'api' ? 'API' : 'MOCK'}
                  </span>
                )}
              </span>
            </div>
            {result && (
              <button onClick={reset} style={{
                background: 'none', border: `1px solid ${th.border}`,
                borderRadius: th.r, color: th.textSub,
                fontSize: 10, padding: '3px 9px', cursor: 'pointer',
                fontFamily: th.mono, letterSpacing: dark ? '0.06em' : 0
              }}>
                {th.label('RESET')}
              </button>
            )}
          </div>

          <ResultPanel result={result} th={th} isAnalyzing={loading} />
        </div>
      </div>

      {/* ── Tweaks ──────────────────────────────────────────────────── */}
      <TweaksPanel>
        <TweakSection label="디자인 스타일" />
        <TweakSelect
          label="스타일"
          value={tw.style}
          options={['다크 테크', '클린 모던', '블루', '그린']}
          onChange={v => setTweak('style', v)}
        />
      </TweaksPanel>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
